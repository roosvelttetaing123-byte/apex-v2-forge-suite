name: Forge Suite CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  # ── Syntax check — fast fail before expensive tests ───────────────────────
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Compile all Python files
        run: |
          find . -name "*.py" \
            ! -path "./apex-ui/*" \
            ! -path "./.git/*" \
            -print0 | xargs -0 python -m py_compile

  # ── Unit + integration tests ──────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: syntax

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only the packages needed by the test suite
          # (avoids heavy optional deps like WeasyPrint, Playwright, Scapy)
          pip install \
            'pydantic[email]>=2.5.0' \
            'pyyaml>=6.0.1' \
            'aiohttp>=3.9.0' \
            'jinja2>=3.1.2' \
            'sqlalchemy>=2.0.0' \
            'networkx>=3.2.0' \
            'httpx>=0.27.0' \
            'fastapi>=0.109.0' \
            'uvicorn[standard]>=0.27.0' \
            'pytest>=7.4.0' \
            'pytest-asyncio>=0.23.0' \
            'pytest-timeout>=2.2.0'

      - name: Run test suite
        run: |
          cd forge-suite 2>/dev/null || true
          python -m pytest tests/ \
            -v \
            --tb=short \
            --strict-markers \
            -p no:warnings \
            --timeout=60
        env:
          PYTHONPATH: .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            **/pytest-results.xml
          if-no-files-found: ignore

  # ── Security scan (bandit) ────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: syntax

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install bandit
        run: pip install 'bandit>=1.7.6'

      - name: Run bandit
        run: |
          cd forge-suite 2>/dev/null || true
          bandit -r . \
            --exclude ./apex-ui,./tests \
            -ll \
            -ii \
            -f txt \
            --exit-zero
        continue-on-error: false

  # ── Docker build check ────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: forge-suite:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # ── Coverage report ───────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: syntax

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install dependencies + coverage
        run: |
          pip install \
            'pydantic[email]>=2.5.0' \
            'pyyaml>=6.0.1' \
            'aiohttp>=3.9.0' \
            'jinja2>=3.1.2' \
            'sqlalchemy>=2.0.0' \
            'networkx>=3.2.0' \
            'httpx>=0.27.0' \
            'fastapi>=0.109.0' \
            'uvicorn[standard]>=0.27.0' \
            'pytest>=7.4.0' \
            'pytest-asyncio>=0.23.0' \
            'pytest-timeout>=2.2.0' \
            'pytest-cov>=4.1.0'

      - name: Run coverage
        run: |
          cd forge-suite 2>/dev/null || true
          python -m pytest tests/ \
            --cov=common \
            --cov=webforge/core \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q
        env:
          PYTHONPATH: .

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage.xml"
          if-no-files-found: ignore
