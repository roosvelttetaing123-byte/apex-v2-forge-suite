id: oracle-tns-listener-exposure
name: "Oracle TNS Listener Exposed — Poison/SID Enumeration Risk"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:L"
tags: [exposure, oracle, tns, listener, sid-enum, database]
target_service: oracle
target_ports: [1521, 1526, 1527, 1528]
description: |
  Oracle TNS Listener is exposed on port 1521. Unauthenticated remote attackers
  can query the listener to enumerate Oracle SIDs, service names, and listener
  version. In older Oracle versions (<10g), the listener accepts remote
  configuration commands (TNS Listener Poisoning). Valid SIDs enable brute-force
  authentication attacks against Oracle accounts (SYS, SYSTEM, DBSNMP).
  MITRE ATT&CK: T1046 (Network Service Scanning), T1110 (Brute Force).
detection:
  - type: tcp_probe
    ports: [1521, 1526]
    send: "\x00\x57\x00\x00\x01\x00\x00\x00\x01\x36\x01\x2c\x00\x00\x08\x00\x7f\xff\x86\x0e\x00\x00\x00\x01\x00\x00\x30\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00"
    read_bytes: 1024
    match:
      - banner_regex: "(?i)(TNSLSNR|Oracle|VSNNUM|TNS)"
    match_all: false
remediation: |
  Require password authentication for Oracle TNS Listener (set PASSWORDS_LISTENER
  in listener.ora). Disable TNSLSNR remote configuration (set ADMIN_RESTRICTIONS=ON).
  Restrict port 1521 to application server IPs only. Upgrade to Oracle 12c+ with
  valid listener password and TCPS for encryption.
references:
  - https://www.tenable.com/plugins/nessus/12085
  - https://orasec.blogspot.com/2009/01/oracle-tns-listener-poisoning.html
  - https://cwe.mitre.org/data/definitions/306.html
