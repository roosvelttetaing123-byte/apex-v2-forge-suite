id: redis-unauthenticated
name: "Redis Server Unauthenticated Access"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [misconfig, redis, no-auth, rce]
target_service: redis
target_ports: [6379, 6380]
description: |
  Redis server accessible without authentication. Allows data theft,
  modification, and RCE via CONFIG SET + module loading or
  Lua script execution.
detection:
  - type: tcp_probe
    ports: [6379, 6380]
    send: "PING\r\n"
    match:
      - body_contains: "+PONG"
  - type: tcp_probe
    ports: [6379, 6380]
    send: "INFO server\r\n"
    match:
      - body_contains: "redis_version"
remediation: "Enable Redis AUTH. Bind to localhost. Use ACLs in Redis 6+."
references:
  - https://redis.io/topics/security
