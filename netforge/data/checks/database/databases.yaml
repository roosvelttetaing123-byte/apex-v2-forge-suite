id: CVE-2012-1823-php-cgi-rce
cve: CVE-2012-1823
name: "PHP-CGI Remote Code Execution via Query String Parameter Injection"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, php, cgi, cisa-kev, web, injection]
target_service: http
target_ports: [80, 443, 8080, 8443]
description: |
  PHP before 5.3.12 and 5.4.x before 5.4.2 when configured as a CGI script
  processes certain query string parameters as command-line options.
  An attacker can pass -s to view source code, or -d allow_url_include=1
  combined with -d auto_prepend_file= to achieve RCE without authentication.
  Still found on legacy LAMP stacks backing database-driven applications.
  MITRE ATT&CK: T1190 (Exploit Public-Facing Application).
detection:
  - type: http
    method: GET
    path: "/index.php?-s"
    match:
      - status_code: 200
      - body_regex: "<\\?php|<font color"
  - type: http
    method: GET
    path: "/?-s"
    match:
      - status_code: 200
      - body_contains: "<?php"
  - type: version
    cpe_vendor: "php"
    cpe_product: "php"
    version_range: ">=5.3.0,<5.3.12"
remediation: |
  Upgrade PHP immediately to 5.3.12+ or 5.4.2+. If upgrading is not possible,
  use mod_rewrite rules to block requests containing PHP query string command flags.
  Move away from CGI mode to PHP-FPM or mod_php.
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2012-1823
  - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  - https://www.exploit-db.com/exploits/18836
