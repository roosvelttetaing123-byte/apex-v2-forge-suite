id: rabbitmq-management-unauthenticated
name: "RabbitMQ Management Interface Default Credentials"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L"
tags: [misconfig, rabbitmq, default-creds, message-queue]
target_service: rabbitmq
target_ports: [15672, 15671]
description: |
  RabbitMQ management plugin web interface is accessible with default
  credentials (guest/guest). The guest account is restricted to localhost
  by default in RabbitMQ 3.3+, but many deployments override this.
  Full access allows: reading queued messages, publishing malicious messages,
  modifying exchanges/queues, and in some configurations achieving SSRF.
  MITRE ATT&CK: T1078.001 (Default Accounts), T1530.
detection:
  - type: http
    method: GET
    path: "/api/overview"
    headers:
      Authorization: "Basic Z3Vlc3Q6Z3Vlc3Q="
    match:
      - status_code: 200
      - body_contains: "rabbitmq_version"
  - type: http
    method: GET
    path: "/"
    match:
      - status_code: 200
      - body_contains: "RabbitMQ Management"
    match_all: false
remediation: |
  Change or disable the guest account: rabbitmqctl delete_user guest.
  Create named admin users with strong passwords. Restrict management
  interface to trusted networks. Enable TLS for AMQP and management API.
references:
  - https://www.rabbitmq.com/access-control.html
  - https://cwe.mitre.org/data/definitions/1188.html
