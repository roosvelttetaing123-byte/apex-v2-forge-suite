id: postgresql-pg-hba-world-readable
name: "PostgreSQL Accepting Connections — pg_hba World Access Indicator"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
tags: [misconfig, postgresql, pg-hba, exposure, default-creds]
target_service: postgresql
target_ports: [5432]
description: |
  PostgreSQL server is accepting network connections, which may indicate
  pg_hba.conf is configured with overly permissive access rules such as
  'host all all 0.0.0.0/0 md5' or 'host all all 0.0.0.0/0 trust'.
  Banner enumeration confirms the PostgreSQL version and network exposure.
  Combined with default credentials (postgres/postgres) this commonly
  leads to full database compromise.
  MITRE ATT&CK: T1078.001 (Default Accounts), T1190.
detection:
  - type: banner
    ports: [5432]
    match:
      - banner_regex: "(?i)(PostgreSQL|PGSQL|invalid startup packet)"
  - type: tcp_probe
    ports: [5432]
    send: "\x00\x00\x00\x17\x00\x03\x00\x00user\x00postgres\x00\x00"
    read_bytes: 1024
    match:
      - banner_regex: "(?i)(PostgreSQL|authentication|FATAL|password)"
    match_all: false
remediation: |
  Audit /var/lib/postgresql/*/main/pg_hba.conf and restrict connection rules
  to specific IP ranges. Use scram-sha-256 authentication (not trust or md5).
  Change default postgres account password. Bind PostgreSQL to localhost unless
  remote access is explicitly required. Deploy SSL/TLS for all remote connections.
references:
  - https://www.postgresql.org/docs/current/auth-pg-hba-conf.html
  - https://cwe.mitre.org/data/definitions/1188.html
---
id: cassandra-unauthenticated
name: "Apache Cassandra Unauthenticated Access"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
tags: [misconfig, cassandra, no-auth, database]
target_service: cassandra
target_ports: [9042, 9160]
description: |
  Apache Cassandra CQL native transport port (9042) is accessible without
  authentication. Default Cassandra installations use AllowAllAuthenticator,
  meaning any client can connect and query all keyspaces without credentials.
  Attackers can read, modify, or delete all data without authentication.
  MITRE ATT&CK: T1078.001 (Default Accounts), T1005 (Data from Local System).
detection:
  - type: tcp_probe
    ports: [9042]
    send: "\x04\x00\x00\x01\x05\x00\x00\x00\x00"
    read_bytes: 1024
    match:
      - banner_regex: "(?i)(cassandra|CQL|READY|cluster_name)"
    match_all: false
  - type: banner
    ports: [9042]
    match:
      - banner_regex: "(?i)(cassandra|CQL native)"
    match_all: false
remediation: |
  Enable authentication in cassandra.yaml: set authenticator: PasswordAuthenticator
  and authorizer: CassandraAuthorizer. Change default cassandra/cassandra credentials.
  Bind native transport to specific interfaces. Use TLS for client-node encryption.
references:
  - https://cassandra.apache.org/doc/latest/cassandra/operating/security.html
  - https://cwe.mitre.org/data/definitions/306.html
