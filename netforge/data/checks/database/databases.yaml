id: influxdb-unauthenticated
name: "InfluxDB Unauthenticated Access"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
tags: [misconfig, influxdb, no-auth, timeseries, metrics]
target_service: influxdb
target_ports: [8086]
description: |
  InfluxDB HTTP API is accessible without authentication. Default installations
  of InfluxDB 1.x have authentication disabled. Attackers can enumerate all
  databases, read time-series data (which often contains security metrics,
  infrastructure telemetry, or operational data), and write malicious data.
  MITRE ATT&CK: T1005, T1078.001.
detection:
  - type: http
    method: GET
    path: "/ping"
    match:
      - status_code: 204
      - header_contains: "X-Influxdb-Version"
  - type: http
    method: GET
    path: "/query?q=SHOW+DATABASES"
    match:
      - status_code: 200
      - body_contains: "results"
      - body_contains: "databases"
    match_all: false
remediation: |
  Enable authentication in influxdb.conf: set auth-enabled = true in [http] section.
  Create admin user before enabling auth: CREATE USER admin WITH PASSWORD '<password>' WITH ALL PRIVILEGES.
  Use InfluxDB 2.x with built-in token-based authentication. Restrict port 8086 access.
references:
  - https://docs.influxdata.com/influxdb/v1.8/administration/authentication_and_authorization/
  - https://cwe.mitre.org/data/definitions/306.html
---
id: neo4j-unauthenticated-browser
name: "Neo4j Browser Unauthenticated Access"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
tags: [misconfig, neo4j, no-auth, graph-database, browser]
target_service: neo4j
target_ports: [7474, 7687]
description: |
  Neo4j database browser interface on port 7474 (HTTP) and Bolt protocol
  on port 7687 are accessible. Earlier Neo4j versions ship with auth disabled
  by default. Attackers can access the Cypher shell, enumerate all graph
  data, and execute arbitrary Cypher queries including procedures that
  may allow Java code execution (apoc.cypher.runFile, dbms.security.*).
  MITRE ATT&CK: T1078.001, T1005.
detection:
  - type: http
    method: GET
    path: "/"
    match:
      - body_contains: "Neo4j"
      - status_code: 200
  - type: http
    method: GET
    path: "/db/data/"
    match:
      - status_code: 200
      - body_contains: "neo4j_version"
    match_all: false
remediation: |
  Enable authentication in neo4j.conf: set dbms.security.auth_enabled=true.
  Change the default neo4j/neo4j password on first login.
  Bind to localhost unless remote access required. Disable the browser UI in production.
references:
  - https://neo4j.com/docs/operations-manual/current/authentication-authorization/
  - https://cwe.mitre.org/data/definitions/306.html
