tags: [rce, deserialization, jackson, java, cisa-kev, injection]
target_service: http
target_ports: [80, 443, 8080, 8443, 8090]
description: |
  FasterXML jackson-databind 2.x before 2.9.9.2 contains a deserialization
  vulnerability via a gadget chain involving logback-core JNDI lookup.
  When polymorphic type handling is enabled (defaultTyping or @JsonTypeInfo),
  a crafted JSON payload can trigger JNDI lookup to an attacker-controlled
  server, leading to remote code execution. Common in Java applications with
  database backends (Spring Boot + JPA, Hibernate, MyBatis applications).
  MITRE ATT&CK: T1190, T1059.007.
detection:
  - type: http
    method: POST
    path: "/api/login"
    headers:
      Content-Type: "application/json"
    body: "{\"username\":\"test\",\"password\":\"test\"}"
    match:
      - body_regex: "(?i)(jackson|ObjectMapper|JsonMappingException|com\\.fasterxml)"
    match_all: false
  - type: version
    cpe_vendor: "fasterxml"
    cpe_product: "jackson-databind"
    version_range: ">=2.0.0,<2.9.9.2"
remediation: |
  Upgrade jackson-databind to 2.9.9.2+, 2.10.x, or 2.11.x.
  Disable global default typing: mapper.deactivateDefaultTyping().
  Use allowlist-based polymorphic type validation.
  Apply virtual patching via WAF rules blocking @class, @type JSON keys.
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2019-12384
  - https://github.com/FasterXML/jackson-databind/issues/2341
  - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
