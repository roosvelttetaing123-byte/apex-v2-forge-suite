id: CVE-2021-25646-druid-rce
cve: CVE-2021-25646
name: "Apache Druid Remote Code Execution via Server Request"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, druid, apache, cisa-kev, analytics]
target_service: druid
target_ports: [8888, 8082, 8083, 8081, 8090]
description: |
  Apache Druid includes the ability to execute user-provided JavaScript code
  embedded in various types of requests. CVE-2021-25646 allows authenticated
  users (and in default configs, unauthenticated users) to execute arbitrary
  code by submitting a crafted request to the /druid/indexer/v1/sampler endpoint
  with a malicious transform expression or JavaScript aggregator.
  MITRE ATT&CK: T1190, T1059.007 (JavaScript).
detection:
  - type: http
    method: GET
    path: "/status"
    match:
      - status_code: 200
      - body_contains: "version"
      - body_contains: "druid"
  - type: http
    method: GET
    path: "/druid/coordinator/v1/config"
    match:
      - status_code: [200, 404, 401]
      - body_regex: "(?i)(druid|coordinator)"
    match_all: false
  - type: version
    cpe_vendor: "apache"
    cpe_product: "druid"
    version_range: ">=0.20.0,<0.21.1"
remediation: |
  Upgrade Apache Druid to 0.21.1 or later. As a workaround, set
  druid.javascript.enabled=false in runtime.properties. Require authentication
  for all Druid API endpoints. Restrict Druid ports to internal networks.
