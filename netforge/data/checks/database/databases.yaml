id: mssql-sa-no-password
name: "MSSQL SA Account Without Password"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [misconfig, mssql, default-creds, no-auth, rce]
target_service: mssql
target_ports: [1433]
description: |
  Microsoft SQL Server system administrator (SA) account has no password set
  or uses a blank password. This provides full database administrator access,
  and via xp_cmdshell can achieve OS-level command execution. Common finding
  on default SQL Server Express installations and legacy deployments.
  MITRE ATT&CK: T1078.001 (Default Accounts), T1059.003 (Windows Command Shell via xp_cmdshell).
detection:
  - type: banner
    ports: [1433]
    match:
      - banner_regex: "(?i)(MSSQL|Microsoft SQL Server)"
  - type: tcp_probe
    ports: [1433]
    send: "\x12\x01\x00\x34\x00\x00\x00\x00\x00\x00\x15\x00\x06\x01\x00\x1b\x00\x01\x02\x00\x1c\x00\x0c\x03\x00\x28\x00\x04\xff\x08\x00\x01\x55\x00\x00\x00\x4d\x53\x53\x51\x4c\x53\x65\x72\x76\x65\x72\x00\xab\xcd"
    read_bytes: 1024
    match:
      - banner_regex: "(?i)(MSSQL|Microsoft SQL|LoginAck)"
    match_all: false
remediation: |
  Set a strong password for the SA account immediately: ALTER LOGIN [sa] WITH PASSWORD='<strong_password>'.
  Disable the SA account if Windows Authentication is used: ALTER LOGIN [sa] DISABLE.
  Enable SQL Server audit logging. Restrict port 1433 to trusted hosts only.
references:
  - https://docs.microsoft.com/en-us/sql/relational-databases/security/choose-an-authentication-mode
  - https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf
