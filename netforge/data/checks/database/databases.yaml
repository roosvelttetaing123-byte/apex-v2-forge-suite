  - https://nvd.nist.gov/vuln/detail/CVE-2021-25646
  - https://lists.apache.org/thread.html/r685b420f94b0281b5b3e2bd9f89e7b1fa10a97cf0c42fa9b5f1f75f1@%3Cdev.druid.apache.org%3E
