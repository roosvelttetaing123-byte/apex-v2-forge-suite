id: CVE-2023-4911-glibc-looney-tunables
cve: CVE-2023-4911
name: "Glibc Looney Tunables — Local Privilege Escalation via GLIBC_TUNABLES"
severity: high
cvss: "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
tags: [privesc, linux, glibc, local, cisa-kev]
target_service: ssh
target_ports: [22, 2222]
description: |
  A buffer overflow in the GNU C Library (glibc) dynamic loader ld.so when
  processing the GLIBC_TUNABLES environment variable. Affects glibc 2.34
  through 2.38. Exploitable by any local user to gain root privileges.
  Affects RHEL 8/9, Ubuntu 22.04 LTS, Fedora 37/38, Debian 12.
  Detection is performed via SSH banner combined with OS version fingerprinting.
  MITRE ATT&CK: T1068 (Exploitation for Privilege Escalation).
detection:
  - type: banner
    ports: [22, 2222]
    match:
      - banner_regex: "OpenSSH_[0-9]"
  - type: version
    cpe_vendor: "gnu"
    cpe_product: "glibc"
    version_range: ">=2.34,<=2.38"
remediation: |
  Apply vendor security updates immediately. RHEL: yum update glibc.
  Ubuntu: apt-get update && apt-get upgrade libc6.
  As an interim workaround, remove SUID bit from executables that
  process GLIBC_TUNABLES if patching is delayed.
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2023-4911
  - https://www.qualys.com/2023/10/03/cve-2023-4911/looney-tunables-local-privilege-escalation-glibc-ld-so.txt
  - https://access.redhat.com/security/cve/cve-2023-4911
