severity: critical
cvss: "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
tags: [info-disclosure, keepass, memory, credentials, local]
target_ports: []
description: |
  KeePass 2.x before 2.54 allows an attacker with local access to recover
  the master password from process memory or a memory dump. The password
  appears as cleartext strings in heap memory due to the use of a custom
  SecureTextBoxEx control that retains characters in memory.
  Tools like keepass-dump-masterkey can recover all but the first character.
  MITRE ATT&CK: T1003 (OS Credential Dumping).
detection:
  - type: banner
    ports: [445]
    match:
      - banner_regex: "(?i)(Windows)"
  - type: version
    cpe_vendor: "keepass"
    cpe_product: "keepass"
    version_range: ">=2.0,<2.54"
remediation: |
  Upgrade KeePass to 2.54 or later. Consider enterprise password managers
  with hardware-backed key storage. Restrict physical and remote access
  to systems running KeePass. Enable memory protection via Windows Credential Guard.
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2023-32784
  - https://github.com/vdohney/keepass-password-dumper
