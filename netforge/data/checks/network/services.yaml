id: rsync-unauthenticated-access
name: "rsync Service Unauthenticated Access"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
tags: [misconfig, rsync, no-auth, data-exfil]
target_service: rsync
target_ports: [873]
description: |
  rsync daemon running on port 873 without authentication allows any
  unauthenticated client to list modules and read/write files depending
  on module configuration. Attackers can exfiltrate data or upload
  malicious files for RCE via cron/authorized_keys injection.
  MITRE ATT&CK: T1048 (Exfiltration Over Alternative Protocol), T1105 (Ingress Tool Transfer).
detection:
  - type: banner
    ports: [873]
    match:
      - banner_regex: "@RSYNCD:"
  - type: tcp_probe
    ports: [873]
    send: "@RSYNCD: 31.0\n#list\n"
    read_bytes: 4096
    match:
      - banner_regex: "(?i)(path|comment|module)"
    match_all: false
remediation: |
  Require authentication for all rsync modules in /etc/rsyncd.conf
  (auth users = , secrets file = ). Restrict hosts with hosts allow =.
  Disable rsync daemon if not required. Use SSH-tunneled rsync instead.
references:
  - https://cwe.mitre.org/data/definitions/306.html
  - https://linux.die.net/man/5/rsyncd.conf
  - https://www.rapid7.com/db/modules/auxiliary/scanner/rsync/modules_list/
