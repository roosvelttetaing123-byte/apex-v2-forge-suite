id: nfs-world-readable-export
name: "NFS World-Readable Export with no_root_squash"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
tags: [misconfig, nfs, no-auth, linux, privilege-escalation]
target_service: nfs
target_ports: [2049, 111]
description: |
  NFS server exports filesystems world-readable (*(rw,no_root_squash)) or
  without authentication. The no_root_squash option allows remote root users
  to act as root on mounted shares, enabling privilege escalation by placing
  SUID binaries. Detection via rpcinfo/showmount query to portmapper.
  MITRE ATT&CK: T1005 (Data from Local System), T1068 (Exploitation for Privesc).
detection:
  - type: tcp_probe
    ports: [111]
    send: "\x80\x00\x00\x28\x72\xfe\x1d\x13\x00\x00\x00\x00\x00\x00\x00\x02\x00\x01\x86\xa0\x00\x00\x00\x02\x00\x00\x00\x04\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00"
    read_bytes: 1024
    match:
      - banner_regex: "(?i)(mount|nfs|portmap)"
    match_all: false
  - type: udp_probe
    ports: [2049]
    match:
      - body_regex: "(?i)(nfs|mount)"
    match_all: false
remediation: |
  Audit /etc/exports and remove world-readable entries. Replace *(rw,no_root_squash)
  with explicit host/network ACLs and root_squash. Use NFSv4 with Kerberos
  authentication (sec=krb5p) for sensitive shares. Firewall port 2049 at perimeter.
references:
  - https://cwe.mitre.org/data/definitions/284.html
  - https://linux.die.net/man/5/exports
  - https://www.tenable.com/plugins/nessus/11356
