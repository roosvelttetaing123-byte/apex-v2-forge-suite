id: CVE-2003-0352-dcom-rpc-exposure
cve: CVE-2003-0352
name: "MS-RPC DCOM Interface Exposed — Buffer Overflow Indicator (Port 135)"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rpc, dcom, windows, exposure, ms03-026, reconnaissance]
target_service: msrpc
target_ports: [135]
description: |
  The Microsoft RPC Endpoint Mapper / DCOM interface is exposed on port 135.
  CVE-2003-0352 (MS Blaster worm) is a buffer overflow in the RPCSS service
  via DCOM. While this specific CVE targets older Windows versions, port 135
  exposure indicates: (1) DCOM is enabled, (2) the endpoint mapper can be
  queried for all registered RPC endpoints, (3) potential attack surface for
  DCE/RPC-based attacks including PrintNightmare, PetitPotam, and DCOM lateral
  movement (T1021.003). Detection is passive — port exposure indicates risk.
  MITRE ATT&CK: T1021.003 (Distributed Component Object Model), T1046.
detection:
  - type: tcp_probe
    ports: [135]
    match:
      - banner_regex: "(?i)(MSRPC|\\x05\\x00\\x0d\\x03)"
    match_all: false
  - type: banner
    ports: [135]
    match:
      - banner_regex: "(?i)(Microsoft|Windows|RPC|DCOM)"
    match_all: false
remediation: |
  Block port 135 TCP/UDP at the perimeter firewall — no external access required.
  Disable DCOM if not in use via dcomcnfg.exe or Group Policy.
  Apply all Windows security updates. Monitor for lateral movement via T1021.003.
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2003-0352
  - https://docs.microsoft.com/en-us/security-updates/securitybulletins/2003/ms03-026
  - https://attack.mitre.org/techniques/T1021/003/
