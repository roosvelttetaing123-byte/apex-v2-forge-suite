id: x11-display-exposed
name: "X11 Display Server Exposed (Port 6000)"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
tags: [misconfig, x11, display, remote-access, screenshot]
target_service: x11
target_ports: [6000, 6001, 6002, 6003]
description: |
  X11 display server is accessible on port 6000 (or 6001+ for multiple
  displays) without host-based access control. This allows remote attackers
  to capture screenshots of the running desktop, inject keystrokes, record
  keystrokes (xspy/xinput), and execute arbitrary programs on the display.
  Trivially exploitable with xspy, xwd, or xinput.
  MITRE ATT&CK: T1113 (Screen Capture), T1056.001 (Keylogging).
detection:
  - type: tcp_probe
    ports: [6000, 6001, 6002, 6003]
    send: "\x6c\x00\x0b\x00\x00\x00\x00\x00\x00\x00\x00\x00"
    read_bytes: 1024
    match:
      - banner_regex: "(?i)(MIT-MAGIC-COOKIE|XFree86|X.Org|failed to authenticate)"
    match_all: false
remediation: |
  Enable X11 access control: xhost - (disable all access), then whitelist
  specific hosts with xhost +hostname. Prefer SSH X11 forwarding instead of
  direct TCP exposure. Block ports 6000-6063 at the firewall.
references:
  - https://www.tenable.com/plugins/nessus/10407
  - https://cwe.mitre.org/data/definitions/284.html
