id: CVE-2013-4786-ipmi-rakp-hash
cve: CVE-2013-4786
name: "IPMI 2.0 RAKP Authentication Hash Disclosure"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
tags: [info-disclosure, ipmi, hash, credentials, bmc]
target_service: ipmi
target_ports: [623]
description: |
  IPMI 2.0 RAKP authentication protocol discloses a HMAC-SHA1 hash of
  the BMC password in response to an authentication initiation request.
  This allows remote attackers to perform offline dictionary attacks
  against the IPMI admin password without completing authentication.
  Affects all IPMI 2.0 compliant BMCs (Supermicro, HP iLO, Dell iDRAC, IBM).
  Tool: ipmitool + hashcat/john can crack common passwords in minutes.
  MITRE ATT&CK: T1110.002 (Password Cracking), T1552 (Unsecured Credentials).
detection:
  - type: udp_probe
    ports: [623]
    match:
      - body_regex: "(?i)(RMCP|IPMI|RAKP)"
    match_all: false
  - type: banner
    ports: [623]
    match:
      - banner_regex: "(?i)(RMCP)"
    match_all: false
remediation: |
  Use complex, unique IPMI passwords (>20 characters). Restrict IPMI access
  to dedicated out-of-band management network. Enable IPMI VLAN segmentation.
  Disable IPMI over LAN (IPMI-over-LAN) if BMC remote management is not needed.
  Use stronger authentication mechanisms where supported (IPMI 2.0 with RAKP4).
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2013-4786
  - https://www.rapid7.com/db/modules/auxiliary/scanner/ipmi/ipmi_dumphashes/
  - https://fish2.com/ipmi/who-else-is-using-your-bmc.pdf
