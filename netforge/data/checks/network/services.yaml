id: CVE-2024-6387-openssh-regresshion
cve: CVE-2024-6387
name: "OpenSSH regreSSHion — Signal Handler Race Condition RCE"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, ssh, cisa-kev, race-condition]
target_service: ssh
