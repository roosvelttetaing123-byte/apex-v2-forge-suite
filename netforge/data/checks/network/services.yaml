id: rpcbind-exposed
name: "Rpcbind/Portmapper Service Exposed"
severity: medium
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
tags: [exposure, rpc, portmapper, reconnaissance]
target_service: rpc
target_ports: [111]
description: |
  Rpcbind (portmapper) is exposed on port 111, allowing remote enumeration
  of all RPC services registered on the host including NFS, NIS, and custom
