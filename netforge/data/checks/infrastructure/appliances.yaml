id: jenkins-unauthenticated
name: "Jenkins Dashboard Unauthenticated Access"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [misconfig, jenkins, ci-cd, admin-panel]
target_ports: [8080, 8443, 443, 80]
description: |
  Jenkins CI/CD dashboard accessible without authentication.
  Allows job creation, script console access, and credential theft.
detection:
  - type: http
    method: GET
    path: "/script"
    match:
      - status_code: 200
      - body_regex: "(?i)(script console|groovy|jenkins)"
  - type: http
    method: GET
    path: "/api/json"
    match:
      - status_code: 200
      - body_contains: "\"_class\""
remediation: "Enable Jenkins security. Configure authentication and authorization."
references:
  - https://www.jenkins.io/doc/book/security/
---
id: gitlab-ce-exposed
name: "GitLab Exposed Instance Detection"
severity: medium
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
tags: [info-disclosure, gitlab, ci-cd]
target_ports: [443, 80, 8443]
description: "GitLab instance detected. Check for public registration and known CVEs."
detection:
  - type: http
    method: GET
    path: "/users/sign_in"
    match:
      - body_regex: "(?i)(gitlab|sign.in.*gitlab)"
    match_all: false
  - type: http
    method: GET
    path: "/explore"
    match:
      - body_regex: "(?i)(gitlab|explore.*projects)"
    match_all: false
remediation: "Disable public registration. Restrict access. Keep GitLab updated."
references:
  - https://docs.gitlab.com/ee/security/
