id: CVE-2024-23113-fortios-fmtstr
cve: CVE-2024-23113
name: "FortiOS fgfmd Format String RCE"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, fortinet, cisa-kev, format-string]
target_ports: [541, 443]
description: |
  FortiOS fgfmd daemon format string vulnerability allowing
  unauthenticated remote code execution. Affects FortiOS 7.0-7.4,
  FortiProxy, FortiPAM, FortiSwitchManager.
detection:
  - type: version
    cpe_vendor: "fortinet"
    cpe_product: "fortios"
    version_range: ">=7.0.0,<7.0.14"
  - type: http
    method: GET
    path: "/login"
    match:
      - body_regex: "(?i)(fortinet|fortigate|FortiWeb)"
    match_all: false
remediation: "Upgrade FortiOS to 7.0.14+, 7.2.7+, or 7.4.3+."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2024-23113
---
id: CVE-2023-27997-fortios-heap
cve: CVE-2023-27997
name: "FortiOS SSL-VPN Heap Buffer Overflow RCE (XORtigate)"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, fortinet, cisa-kev, vpn, heap-overflow]
target_ports: [443, 10443, 8443]
description: |
  FortiOS SSL-VPN heap buffer overflow allowing pre-auth RCE.
  Nicknamed XORtigate. Affects all FortiOS with SSL-VPN enabled.
detection:
  - type: http
    method: GET
    path: "/remote/logincheck"
    match:
      - body_regex: "(?i)(fortinet|FortiOS|fgt_lang)"
    match_all: false
  - type: version
    cpe_vendor: "fortinet"
    cpe_product: "fortios"
    version_range: ">=6.0.0,<7.2.5"
remediation: "Upgrade FortiOS to 7.2.5+ or 7.4.0+. Disable SSL-VPN if not needed."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2023-27997
