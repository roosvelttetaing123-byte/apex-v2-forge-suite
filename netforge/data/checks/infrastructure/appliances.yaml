id: CVE-2021-22986-f5-bigip-rce
cve: CVE-2021-22986
name: "F5 BIG-IP iControl REST Unauthenticated RCE"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, f5, bigip, cisa-kev]
target_ports: [443, 8443]
description: "F5 BIG-IP iControl REST interface allows unauthenticated RCE."
detection:
  - type: http
    method: GET
    path: "/mgmt/tm/util/bash"
    match:
      - status_code: [200, 401]
      - body_regex: "(?i)(BIG-IP|f5|iControl)"
    match_all: false
  - type: http
    method: GET
    path: "/tmui/login.jsp"
    match:
      - body_regex: "(?i)(BIG-IP|F5 Networks|tmui)"
    match_all: false
remediation: "Apply F5 security advisory K02566623."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2021-22986
