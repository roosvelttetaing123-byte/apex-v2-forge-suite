id: CVE-2023-46805-ivanti-auth-bypass
cve: CVE-2023-46805
cves:
  - CVE-2023-46805
  - CVE-2024-21887
name: "Ivanti Connect Secure Auth Bypass + RCE"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, ivanti, vpn, cisa-kev, auth-bypass]
target_ports: [443, 8443]
description: |
  Ivanti Connect Secure (Pulse Secure) authentication bypass
  chained with command injection for unauthenticated RCE.
  Massively exploited starting January 2024.
detection:
  - type: http
    method: GET
    path: "/api/v1/totp/user-backup-code/../../system/maintenance/archiving/cloud-server-test-connection"
    match:
      - status_code: [200, 403]
    match_all: false
  - type: http
    method: GET
    path: "/dana-na/auth/url_default/welcome.cgi"
    match:
      - body_regex: "(?i)(pulse|ivanti|connect secure|welcome)"
    match_all: false
remediation: "Apply Ivanti patches. Factory reset compromised appliances."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2023-46805
