id: CVE-2019-19781-citrix-adc-rce
cve: CVE-2019-19781
name: "Citrix ADC/Gateway Path Traversal RCE (Shitrix)"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, citrix, cisa-kev, vpn, path-traversal]
target_ports: [443, 8443]
description: |
  Citrix ADC and Gateway path traversal allowing unauthenticated
  RCE via directory traversal to write arbitrary files.
  Nicknamed Shitrix. Massively exploited.
detection:
  - type: http
    method: GET
    path: "/vpn/../vpns/cfg/smb.conf"
    match:
      - status_code: 200
      - body_regex: "(?i)(\\[global\\]|workgroup|netbios)"
    match_all: false
  - type: http
    method: GET
    path: "/vpn/index.html"
    match:
      - body_regex: "(?i)(citrix|netscaler|receiver)"
    match_all: false
remediation: "Upgrade Citrix ADC/Gateway to latest. Check for webshells."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2019-19781
