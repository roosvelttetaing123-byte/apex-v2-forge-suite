id: CVE-2021-20016-sonicwall-sqli
cve: CVE-2021-20016
name: "SonicWall SMA 100 SQL Injection"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [sqli, sonicwall, cisa-kev, vpn]
target_ports: [443, 8443]
description: |
  SonicWall SMA 100 series SQL injection allowing unauthenticated
  credential harvesting. Used by UNC2447 threat actor.
detection:
  - type: http
    method: GET
    path: "/cgi-bin/welcome"
    match:
      - body_regex: "(?i)(sonicwall|SMA|virtual office)"
    match_all: false
  - type: http
    method: GET
    path: "/"
    match:
      - body_regex: "(?i)(sonicwall|sslvpn)"
    match_all: false
remediation: "Apply SonicWall firmware update. Reset all VPN credentials."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2021-20016
