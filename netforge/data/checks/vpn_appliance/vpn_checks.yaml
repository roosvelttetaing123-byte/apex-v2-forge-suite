id: CVE-2023-35078-ivanti-epmm-auth-bypass
cve: CVE-2023-35078
name: "Ivanti EPMM (MobileIron) Authentication Bypass"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [auth-bypass, ivanti, mobileiron, cisa-kev]
target_ports: [443, 8443]
description: |
  Ivanti EPMM (formerly MobileIron) authentication bypass via
  API path manipulation. Exploited against Norwegian government.
detection:
  - type: http
    method: GET
    path: "/mifs/aad/api/v2/ping"
    match:
      - status_code: 200
      - body_regex: "(?i)(mifs|mobileiron|ivanti)"
    match_all: false
  - type: http
    method: GET
    path: "/mifs/login.jsp"
    match:
      - body_regex: "(?i)(mobileiron|ivanti|endpoint manager)"
    match_all: false
remediation: "Upgrade Ivanti EPMM to latest version immediately."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2023-35078
