id: CVE-2024-3400-panos-cmd-injection
cve: CVE-2024-3400
name: "PAN-OS GlobalProtect Command Injection RCE"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, paloalto, cisa-kev, vpn, cmd-injection]
target_ports: [443, 4443]
description: |
  Palo Alto Networks PAN-OS GlobalProtect gateway command injection
  allowing unauthenticated RCE. CVSS 10.0 — actively exploited by
  state-sponsored actors including UTA0218.
detection:
  - type: http
    method: GET
    path: "/global-protect/portal/css/login.css"
    match:
      - status_code: 200
      - body_regex: "(?i)(global.?protect|palo.?alto)"
    match_all: false
  - type: http
    method: POST
    path: "/ssl-vpn/hipreport.esp"
    match:
      - status_code: [200, 403, 404]
    match_all: false
  - type: version
    cpe_vendor: "paloaltonetworks"
    cpe_product: "pan-os"
    version_range: ">=10.2.0,<10.2.9"
remediation: "Upgrade PAN-OS to 10.2.9+, 11.0.4+, or 11.1.2+. Apply hotfix."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2024-3400
  - https://security.paloaltonetworks.com/CVE-2024-3400
---
id: CVE-2023-20269-cisco-asa-vpn
cve: CVE-2023-20269
name: "Cisco ASA/FTD VPN Brute-Force & Unauthorized Access"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N"
tags: [auth-bypass, cisco, cisa-kev, vpn]
target_ports: [443, 8443]
description: |
  Cisco ASA and FTD software vulnerability allowing brute-force
  attacks against VPN credentials and unauthorized VPN tunnel
  establishment. Exploited by Akira ransomware.
detection:
  - type: http
    method: GET
    path: "/+CSCOE+/logon.html"
    match:
      - body_regex: "(?i)(cisco|anyconnect|webvpn|adaptive security)"
    match_all: false
  - type: http
    method: GET
    path: "/"
    match:
      - header_regex: "(?i)(cisco|asa)"
    match_all: false
remediation: "Apply Cisco security advisory cisco-sa-asaftd-ravpn-auth. Enable MFA."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2023-20269
