id: vpn-ssl-weak-ciphers
name: "VPN SSL/TLS Weak Cipher Suites"
severity: medium
cvss: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N"
tags: [crypto, ssl, vpn, weak-ciphers]
target_ports: [443, 8443, 10443, 4443]
description: |
  VPN gateway SSL/TLS configuration supports weak cipher suites
  vulnerable to cryptographic attacks (BEAST, POODLE, SWEET32).
detection:
  - type: http
    method: GET
    path: "/"
    match:
      - status_code: [200, 301, 302, 403]
    match_all: false
remediation: "Disable SSLv3, TLS 1.0, TLS 1.1. Remove RC4, DES, 3DES cipher suites."
references:
  - https://www.ssllabs.com/ssltest/
