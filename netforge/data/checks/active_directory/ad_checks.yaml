id: CVE-2021-34527-printnightmare
cve: CVE-2021-34527
name: "PrintNightmare — Windows Print Spooler RCE/LPE Version Indicator (CVE-2021-34527)"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, active-directory, spooler, print, cisa-kev, domain-compromise]
target_service: msrpc
target_ports: [445, 135]
description: |
  The Windows Print Spooler service fails to restrict access to the
  RpcAddPrinterDriverEx() and RpcAddPrinterEx() functions. Authenticated
  domain users can exploit this to load a malicious DLL as SYSTEM (local
  privilege escalation) or remotely from a domain-joined host (RCE).
  On domain controllers, this leads to immediate domain compromise.
  NOTE: Version-based detection triggers on unpatched Windows Server 2019.
  SMB banner alone does NOT confirm Spooler is running. Confirm spooler
  status with: rpcdump.py <target> | grep -i spoolss (via Impacket).
  MITRE ATT&CK: T1547.012 (Print Processors), T1068 (Exploitation for Privesc).
detection:
  - type: tcp_probe
    ports: [445]
    match:
      - banner_regex: "(?i)(NTLMSSP|SMB2)"
    match_all: false
  - type: version
    cpe_vendor: "microsoft"
    cpe_product: "windows_server_2019"
    version_range: ">=10.0,<10.0.17763.2029"
remediation: |
  Apply CVE-2021-34527 security update (KB5004945 and subsequent patches).
  Disable Print Spooler on all DCs and servers where printing is not required:
  Stop-Service -Name Spooler -Force; Set-Service -Name Spooler -StartupType Disabled.
  Restrict inbound RPC to the spooler via Windows Firewall. Use 'Point and Print Restrictions' GPO.
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2021-34527
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34527
  - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  - https://github.com/cube0x0/CVE-2021-1675
