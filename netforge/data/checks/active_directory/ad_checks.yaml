id: adcs-web-enrollment-exposed
name: "Active Directory Certificate Services Web Enrollment Interface Exposed"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
tags: [adcs, active-directory, certsrv, ntlm-relay, esc8, web-enrollment]
target_service: http
target_ports: [80, 443]
description: |
  The Active Directory Certificate Services (AD CS) web enrollment interface
  (/certsrv/) is exposed. This interface uses NTLM authentication by default,
  making it a target for NTLM relay attacks (ESC8). Combined with coercion
  techniques (PetitPotam, PrinterBug), an attacker can relay DC machine account
  credentials to the web enrollment endpoint to request a DC certificate,
  enabling Kerberos PKINIT authentication as the DC and DCSync (domain compromise).
  MITRE ATT&CK: T1557.001, T1649 (Shadow Credentials), T1003.006 (DCSync).
detection:
  - type: http
    method: GET
    path: "/certsrv/"
    match:
      - status_code: [200, 401]
      - body_regex: "(?i)(Certificate Services|Microsoft Active Directory Certificate|certsrv\\.asp|certenroll)"
  - type: http
    method: GET
    path: "/certsrv/certrqma.asp"
    match:
      - status_code: [200, 401]
      - body_regex: "(?i)(Microsoft Certificate Services|Web Enrollment|certificate request)"
    match_all: false
remediation: |
  Enable Extended Protection for Authentication (EPA) on all IIS-based AD CS endpoints:
  set Require SSL and enable Windows Authentication with EPA = Required.
  Disable NTLM authentication on AD CS web enrollment, require Kerberos only.
  Apply Microsoft ADV210003. Run Certify.exe or Certipy to audit all enabled templates.
references:
  - https://posts.specterops.io/certified-pre-owned-d95910965cd2
  - https://github.com/ly4k/Certipy
  - https://docs.microsoft.com/en-us/windows-server/identity/ad-cs/active-directory-certificate-services-overview
