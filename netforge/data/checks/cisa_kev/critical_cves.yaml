id: CVE-2023-4966-citrix-bleed
cve: CVE-2023-4966
name: "Citrix Bleed — NetScaler Information Disclosure"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
tags: [info-disclosure, citrix, cisa-kev, session-hijack]
target_ports: [443, 8443]
description: |
  Citrix NetScaler ADC and Gateway buffer overflow allowing
  unauthenticated session token extraction. Actively exploited
  by ransomware groups including LockBit.
detection:
  - type: http
    method: GET
    path: "/oauth/idp/.well-known/openid-configuration"
    match:
      - status_code: 200
      - body_contains: "issuer"
  - type: http
    method: POST
    path: "/oauth/idp/.well-known/openid-configuration"
    headers:
      Host: "a]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]"
    match:
      - body_regex: "(?i)(ns_vpn|netscaler|citrix)"
    match_all: false
remediation: "Apply Citrix security update CTX579459. Rotate all session tokens."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2023-4966
  - https://support.citrix.com/article/CTX579459
