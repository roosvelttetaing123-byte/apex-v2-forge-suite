id: CVE-2021-26855-proxylogon
cve: CVE-2021-26855
cves:
  - CVE-2021-26855
  - CVE-2021-26857
  - CVE-2021-26858
  - CVE-2021-27065
name: "Microsoft Exchange ProxyLogon RCE"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, exchange, cisa-kev, proxylogon, apt]
target_ports: [443, 8443]
description: |
  Microsoft Exchange Server SSRF leading to pre-auth RCE.
  Exploited by HAFNIUM APT group targeting US entities.
  Full chain: SSRF → auth bypass → arbitrary file write → webshell.
detection:
  - type: http
    method: GET
    path: "/owa/auth/x.js"
    match:
      - status_code: [200, 302, 401]
      - header_regex: "(?i)x-owa-version"
    match_all: false
  - type: http
    method: GET
    path: "/ecp/default.flt"
    match:
      - status_code: [200, 302]
    match_all: false
  - type: http
    method: GET
    path: "/owa/"
    match:
      - body_regex: "(?i)(Exchange|OWA)"
      - header_regex: "(?i)x-owa-version: 15\\."
    match_all: false
remediation: "Apply Microsoft Exchange cumulative updates. Check for webshells."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2021-26855
  - https://msrc-blog.microsoft.com/2021/03/02/multiple-security-updates-released-for-exchange-server/
