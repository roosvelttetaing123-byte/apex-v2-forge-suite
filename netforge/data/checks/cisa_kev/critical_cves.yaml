id: CVE-2023-34362-moveit-sqli
cve: CVE-2023-34362
name: "MOVEit Transfer SQL Injection"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [sqli, moveit, cisa-kev, ransomware]
target_ports: [443, 8443]
description: |
  Progress MOVEit Transfer SQL injection allowing unauthenticated
  access to the database. Massively exploited by Cl0p ransomware
  in 2023, affecting 2,500+ organizations.
detection:
  - type: http
    method: GET
    path: "/moveitisapi/moveitisapi.dll?action=m2"
    match:
      - status_code: [200, 302, 401]
      - body_regex: "(?i)(moveit|MOVEit)"
    match_all: false
  - type: http
    method: GET
    path: "/human.aspx"
    match:
      - body_regex: "(?i)(moveit|silogin)"
    match_all: false
  - type: http
    method: POST
    path: "/guestaccess.aspx"
    match:
      - body_regex: "(?i)(moveit|guestaccess)"
    match_all: false
remediation: "Upgrade MOVEit Transfer to patched version. Apply Progress advisory."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2023-34362
  - https://community.progress.com/s/article/MOVEit-Transfer-Critical-Vulnerability
