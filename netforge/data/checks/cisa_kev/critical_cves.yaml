id: CVE-2022-22965-spring4shell
cve: CVE-2022-22965
name: "Spring Framework RCE (Spring4Shell)"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, java, spring, cisa-kev]
description: |
  Spring Framework <=5.3.17 RCE via data binding to Class.classLoader
  when running on JDK 9+ with Apache Tomcat as WAR deployment.
detection:
  - type: http
    method: POST
    path: "/"
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    body: "class.module.classLoader.DefaultAssertionStatus=nonsense"
    match:
      - status_code: [400, 500]
      - body_regex: "(?i)(spring|whitelabel|error)"
    match_all: false
  - type: http
    method: GET
    path: "/actuator/env"
    match:
      - status_code: 200
      - body_contains: "spring"
  - type: version
    cpe_vendor: "vmware"
    cpe_product: "spring_framework"
    version_range: ">=5.3.0,<5.3.18"
remediation: "Upgrade Spring Framework to 5.3.18+ or 5.2.20+."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2022-22965
  - https://spring.io/blog/2022/03/31/spring-framework-rce-early-announcement
