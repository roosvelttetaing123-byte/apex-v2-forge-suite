id: CVE-2024-21762-fortios-rce
cve: CVE-2024-21762
name: "FortiOS SSL VPN Out-of-Bounds Write RCE"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, fortinet, cisa-kev, vpn]
target_ports: [443, 10443, 8443]
description: |
  FortiOS SSL VPN out-of-bounds write vulnerability allowing
  unauthenticated remote code execution via specially crafted HTTP requests.
  Exploited in the wild by state-sponsored APT groups.
detection:
  - type: http
    method: GET
    path: "/remote/logincheck"
    match:
      - body_regex: "(?i)(fortinet|fortigate|FortiOS)"
    match_all: false
  - type: http
    method: GET
    path: "/remote/fgt_lang?lang=/../../../..//////////dev/cmdb/sslvpn_websession"
    match:
      - status_code: [200, 403]
      - body_regex: "(?i)(var |fgt_lang|ssl)"
    match_all: false
  - type: version
    cpe_vendor: "fortinet"
    cpe_product: "fortios"
    version_range: ">=7.2.0,<7.2.7"
remediation: "Upgrade FortiOS to 7.2.7+, 7.4.3+, or 7.6.0+."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2024-21762
  - https://www.fortiguard.com/psirt/FG-IR-24-015
