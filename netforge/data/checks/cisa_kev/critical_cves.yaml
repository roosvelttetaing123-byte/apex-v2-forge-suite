id: CVE-2019-0708-bluekeep
cve: CVE-2019-0708
name: "BlueKeep — RDP Remote Code Execution"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, rdp, windows, cisa-kev, wormable]
target_ports: [3389]
description: |
  Windows Remote Desktop Services (RDP) use-after-free allowing
  unauthenticated remote code execution. Wormable — can spread
  without user interaction like WannaCry.
detection:
  - type: banner
    port: 3389
    send: "\x03\x00\x00\x13\x0e\xe0\x00\x00\x00\x00\x00\x01\x00\x08\x00\x03\x00\x00\x00"
    read_bytes: 1024
    match:
      - banner_regex: "\\x03\\x00"
    match_all: false
remediation: "Apply Microsoft security update KB4499175. Enable NLA. Disable RDP if not needed."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2019-0708
  - https://portal.msrc.microsoft.com/en-US/security-guidance/advisory/CVE-2019-0708
