id: CVE-2021-44228-log4shell
cve: CVE-2021-44228
name: "Apache Log4j RCE (Log4Shell)"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"
tags: [rce, java, cisa-kev, log4j]
description: |
  Apache Log4j2 <=2.14.1 JNDI features do not protect against
  attacker-controlled LDAP and other endpoints. An attacker who can control
  log messages or log message parameters can execute arbitrary code.
  CVSS 10.0 — actively exploited in the wild.
detection:
  - type: http
    method: GET
    path: "/"
    headers:
      X-Api-Version: "${jndi:ldap://127.0.0.1/test}"
      X-Forwarded-For: "${jndi:ldap://127.0.0.1/test}"
      User-Agent: "${jndi:ldap://127.0.0.1/test}"
    match:
      - status_code: [200, 301, 302, 400, 403, 500]
    match_all: false
  - type: http
    method: GET
    paths:
      - "/"
      - "/api"
      - "/login"
    headers:
      X-Api-Version: "${jndi:dns://127.0.0.1/log4shell}"
    match:
      - body_regex: "(?i)(log4j|jndi|javax\\.naming)"
    match_all: false
  - type: version
    cpe_vendor: "apache"
    cpe_product: "log4j"
    version_range: ">=2.0,<2.15.0"
remediation: "Upgrade Log4j to 2.17.1+ or remove JndiLookup class from classpath."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2021-44228
  - https://logging.apache.org/log4j/2.x/security.html
