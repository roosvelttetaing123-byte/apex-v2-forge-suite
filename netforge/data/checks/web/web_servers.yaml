id: wordpress-xmlrpc-enabled
name: "WordPress XML-RPC Enabled"
severity: medium
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L"
tags: [misconfig, wordpress, xmlrpc, brute-force]
target_service: http
description: |
  WordPress XML-RPC interface is enabled, allowing brute-force
  attacks, DDoS amplification, and SSRF via pingback.
detection:
  - type: http
    method: POST
    path: "/xmlrpc.php"
    headers:
      Content-Type: "text/xml"
    body: |
      <?xml version="1.0"?>
      <methodCall><methodName>system.listMethods</methodName></methodCall>
    match:
      - status_code: 200
      - body_contains: "methodResponse"
remediation: "Disable XML-RPC via .htaccess, plugin, or web server config."
references:
  - https://developer.wordpress.org/plugins/security/securing-output/
---
id: wordpress-user-enum
name: "WordPress User Enumeration"
severity: low
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
tags: [info-disclosure, wordpress, user-enum]
target_service: http
description: |
  WordPress reveals valid usernames via author archives or REST API,
  enabling targeted brute-force attacks.
detection:
  - type: http
    method: GET
    path: "/wp-json/wp/v2/users"
    match:
      - status_code: 200
      - body_regex: "\"slug\":\"\\w+"
  - type: http
    method: GET
    path: "/?author=1"
    match:
      - status_code: [200, 301, 302]
    match_all: false
remediation: "Disable user enumeration via security plugin. Block REST API user endpoint."
references:
  - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/11-Test_Cloud_Storage
---
id: tomcat-manager-exposed
name: "Apache Tomcat Manager Interface Exposed"
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [misconfig, tomcat, admin-panel]
target_service: http
target_ports: [8080, 8443, 8888, 80, 443]
description: |
  Apache Tomcat Manager application is publicly accessible.
  If default or weak credentials are in use, attackers can
  deploy malicious WAR files for RCE.
detection:
  - type: http
    method: GET
    paths:
      - "/manager/html"
      - "/manager/status"
      - "/host-manager/html"
    match:
      - status_code: [401, 200, 403]
      - body_regex: "(?i)(tomcat|manager|coyote)"
    match_all: false
remediation: "Restrict Tomcat Manager to localhost. Use strong credentials. Remove if not needed."
references:
  - https://tomcat.apache.org/tomcat-9.0-doc/manager-howto.html
