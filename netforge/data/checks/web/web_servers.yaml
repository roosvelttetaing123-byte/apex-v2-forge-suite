id: directory-listing-enabled
name: "Directory Listing Enabled"
severity: medium
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
tags: [misconfig, directory-listing, info-disclosure]
target_service: http
description: "Web server allows directory listing, exposing file structure."
detection:
  - type: http
    method: GET
    paths:
      - "/icons/"
      - "/images/"
      - "/css/"
      - "/js/"
      - "/assets/"
      - "/uploads/"
    match:
      - body_regex: "(?i)(index of|directory listing|parent directory|\\[dir\\])"
    match_all: false
remediation: "Disable directory listing in web server configuration."
references:
  - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information
