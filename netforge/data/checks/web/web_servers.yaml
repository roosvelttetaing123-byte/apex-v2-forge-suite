id: CVE-2019-6340-drupal-rce
cve: CVE-2019-6340
name: "Drupal REST API Remote Code Execution"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, drupal, cms, cisa-kev]
target_service: http
description: |
  Drupal 8 REST API deserialization vulnerability allowing RCE
  via crafted JSON requests to REST-enabled entities.
detection:
  - type: http
    method: GET
    path: "/node/1?_format=hal_json"
    match:
      - body_regex: "(?i)(drupal|_links|hal_json)"
    match_all: false
  - type: http
    method: GET
    path: "/CHANGELOG.txt"
    match:
      - body_contains: "Drupal"
    match_all: false
  - type: http
    method: GET
    path: "/"
    match:
      - header_regex: "(?i)X-Generator: Drupal"
    match_all: false
remediation: "Update Drupal to latest security release."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2019-6340
