id: nginx-version-disclosure
name: "Nginx Version Disclosure"
severity: low
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
tags: [info-disclosure, nginx, version]
target_service: http
description: "Nginx server reveals version number in HTTP headers."
detection:
  - type: http
    method: GET
    path: "/"
    match:
      - header_regex: "Server: nginx/\\d+\\.\\d+"
remediation: "Set 'server_tokens off;' in nginx.conf."
references:
  - https://nginx.org/en/docs/http/ngx_http_core_module.html#server_tokens
