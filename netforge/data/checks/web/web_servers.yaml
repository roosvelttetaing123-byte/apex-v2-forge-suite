id: CVE-2018-7600-drupalgeddon2
cve: CVE-2018-7600
name: "Drupalgeddon 2 — Remote Code Execution"
severity: critical
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
tags: [rce, drupal, cms, cisa-kev]
target_service: http
description: |
  Drupal before 7.58, 8.x before 8.3.9, 8.4.x before 8.4.6,
  and 8.5.x before 8.5.1 allows remote code execution via
  form API render arrays.
detection:
  - type: http
    method: GET
    path: "/CHANGELOG.txt"
    match:
      - body_regex: "Drupal [78]\\."
    match_all: false
  - type: http
    method: GET
    path: "/"
    match:
      - body_regex: "(?i)(drupal\\.settings|sites/default|drupal\\.js)"
    match_all: false
remediation: "Update to Drupal 7.58+, 8.3.9+, 8.4.6+, or 8.5.1+."
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2018-7600
