id: aspnet-debugging-enabled
name: "ASP.NET Debugging/Trace Enabled"
severity: medium
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
tags: [misconfig, aspnet, debug, info-disclosure]
target_service: http
description: "ASP.NET application has debugging or trace mode enabled in production."
detection:
  - type: http
    method: GET
    path: "/trace.axd"
    match:
      - status_code: 200
      - body_regex: "(?i)(application trace|request details|trace information)"
  - type: http
    method: GET
    path: "/elmah.axd"
    match:
      - status_code: 200
      - body_regex: "(?i)(error log|elmah)"
    match_all: false
remediation: "Set debug='false' in web.config. Remove trace.axd and elmah.axd handlers."
references:
  - https://docs.microsoft.com/en-us/aspnet/web-forms/overview/performance-and-caching/
