schema_version = 2

[execution]
collector = "tests/test_production_embedded_regressions.py"
ci_command = "python -m pytest tests/"
minimum_regressions = 1444
maximum_unsafe_exceptions = 0
owner = "Core Security Engineering Lead"
reason = "Production Test* classes contain genuine unit regressions and are collected through deterministic aliases by the normal pytest suite."

